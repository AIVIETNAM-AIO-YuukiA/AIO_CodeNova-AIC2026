[project]
name = "aio-codenova-aic2026"
version = "0.1.0"
description = "Resumable video retrieval pipeline using shot decomposition and CLIP-style search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pre-commit>=4.6.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.12.0",
    "google-genai>=2.8.0",
    "ollama>=0.6.2",
    "imageio-ffmpeg>=0.6.0",
    "accelerate>=1.14.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "sentencepiece>=0.2.0",
    "bitsandbytes>=0.46.1",
    "fairscale>=0.4.13",
    "vllm; sys_platform == 'linux' or platform_machine == 'aarch64'",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
# Full-text search backend (OCR/ASR). Not required for the core KIS vector flow.
text = [
    "elasticsearch>=8.0.0",
]

[project.scripts]
codenova = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "elasticsearch>=8.0.0",  # also exposed as the `text` extra; here so dev env always has it
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly"
explicit = true

[tool.uv.sources]
vllm = { index = "vllm-nightly" }

[tool.uv]
index-strategy = "unsafe-best-match"
torch-backend = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["external", "src/modules/embedding/_beit3_vendor"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/cli",
    "src/config",
    "src/core",
    "src/indexing",
    "src/modules",
    "src/prompts",
    "src/repository",
    "src/retrieval",
    "src/stores",
    "src/ui",
    "src/video",
    "src/agent",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
