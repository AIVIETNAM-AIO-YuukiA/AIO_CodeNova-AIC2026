services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codenova-qdrant
    ports:
      - "6333:6333"  # REST + web dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Agent LLM (Qwen3.5-4B, port 8884) — GB10, via vLLM. Non-GB10 uses
  # llamacpp-agent below instead; the two are mutually exclusive (both bind
  # 8884), picked by `make agent-up`.
  vllm-agent:
    image: vllm/vllm-openai:cu130-nightly
    container_name: codenova-vllm-agent
    profiles: ["vllm-agent"]
    environment:
      - VLLM_DISABLED_KERNELS=cutlass_moe_mm,cutlass_scaled_mm
      - TORCH_CUDA_ARCH_LIST=12.0
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command: >
      ${VLLM_AGENT_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}
      --host 0.0.0.0
      --port 8884
      --max-model-len 8192
      --gpu-memory-utilization 0.3
      --max-num-seqs 16
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8884:8884"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    shm_size: "64gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  vllm-index:
    image: vllm/vllm-openai:cu130-nightly
    container_name: codenova-vllm-index
    profiles: ["vllm-index"]
    environment:
      - VLLM_DISABLED_KERNELS=cutlass_moe_mm,cutlass_scaled_mm
      - TORCH_CUDA_ARCH_LIST=12.0
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command: >
      ${VLLM_INDEX_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
      --host 0.0.0.0
      --port 8881
      --max-model-len 8192
      --gpu-memory-utilization 0.5
      --max-num-seqs 16
      --moe-backend marlin
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    shm_size: "64gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llamacpp-agent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: codenova-llamacpp-agent
    profiles: ["llamacpp-agent"]
    command: >
      --hf-repo ${LLAMACPP_MODEL:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      --host 0.0.0.0
      --port 8884
      --ctx-size 8192
      --n-gpu-layers 99
      --chat-template-kwargs '{"enable_thinking":false}'
    ports:
      - "8884:8884"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - llamacpp_cache:/root/.cache/llama.cpp
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Full-text index for OCR/ASR search (BM25).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: codenova-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "8882:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Web UI for Elasticsearch (ES itself has no built-in UI, only a REST API).
  elasticvue:
    image: cars10/elasticvue:latest
    container_name: codenova-elasticvue
    ports:
      - "8883:8080"
    restart: unless-stopped

volumes:
  elasticsearch_data:
  llamacpp_cache:
