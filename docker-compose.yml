services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codenova-qdrant
    ports:
      - "6333:6333"  # REST + web dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Two vLLM services, same port (8881) — only run one at a time (same GPU).
  #   make vllm-retrieval   -> Qwen3.5-9B, for online agent/retrieval tasks
  #   make vllm-index       -> Qwen3.6-35B-A3B, for offline captioning/OCR
  # Both use profiles so a bare `docker compose up -d` starts neither.

  # Tuning notes (vLLM on DGX Spark GB10 / unified LPDDR5x memory, ~273GB/s
  # bandwidth-bound, not compute-bound — see vllm.ai/blog/2026-06-01-vllm-dgx-spark
  # and rikkarth.com's Qwen3.6-35B-A3B-on-GB10 benchmark):
  #   - --performance-mode (vLLM >=0.17) picks a curated config per workload
  #     shape: "throughput" for batch jobs, "interactivity" for chat/agent.
  #   - Do NOT set --kv-cache-dtype fp8 here — vLLM's own DGX Spark guidance
  #     says it can hurt predictability/perf on this unified-memory hardware,
  #     unlike on H100-class discrete GPUs where it's usually a win.
  #   - Real benchmark for Qwen3.6-35B-A3B on GB10 scales near-linearly up to
  #     c=32 (155.6 tok/s aggregate), so throughput mode benefits from a
  #     higher --max-num-seqs, not a lower one, for this batch-captioning use case.
  #   - gpu-memory-utilization is NOT proportional to active params (Qwen3.6-35B-A3B
  #     has only 3B active/token, but all 256 experts must still be resident in
  #     VRAM for the router to pick from) — measured on this machine, the AWQ
  #     checkpoint alone loads at 22.87 GiB. 0.25 crashed with
  #     "No available memory for the cache blocks" (KV-cache budget went
  #     negative, -1.96 GiB) before any request could even run. 0.35 was the
  #     first safe value found; bumped to 0.7 once real usage (~13/122 GiB
  #     resident under load) showed most of the 121.7 GiB unified pool was
  #     idle headroom, unlocking more KV cache for max-num-seqs=24. Don't
  #     lower this without re-checking the container doesn't crash-loop.

  vllm-retrieval:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: codenova-vllm-retrieval
    profiles: ["retrieval"]
    command: >
      vllm serve cyankiwi/Qwen3.5-9B-AWQ-4bit
      --host 0.0.0.0
      --port 8881
      --dtype float16
      --max-model-len 4096
      --performance-mode interactivity
      --max-num-seqs 4
      --gpu-memory-utilization 0.25
      --enable-prefix-caching
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Local-model fallback for the VQA/TRAKE agent when GEMINI_API_KEY isn't set
  # (see agent/react.py::create_agent). Two engines, picked by hardware, never
  # both running — same mutual-exclusion pattern as vllm-retrieval/vllm-index,
  # just gated by GPU model instead of by profile alone:
  #   atlas-agent     -> DGX Spark / GB10 only (nvidia-smi name == "NVIDIA GB10").
  #                      Atlas is a from-scratch Rust/CUDA engine hand-tuned for
  #                      GB10's SM121 kernels — cold start ~15s vs vLLM's
  #                      torch.compile-driven ~10min, and its own benchmarks
  #                      show ~3x vLLM's decode throughput on this hardware.
  #                      It does NOT read GGUF or AWQ — only HF checkpoints in
  #                      its own quant formats (NVFP4/FP8/BF16/Turbo), so the
  #                      model here is a separate NVFP4 conversion, not the
  #                      AWQ checkpoint vllm-retrieval uses.
  #   llamacpp-agent  -> any other NVIDIA GPU (e.g. RTX 4090/5090). GGUF via
  #                      llama.cpp/ggml — the portable fallback when Atlas's
  #                      GB10-only kernels don't apply.
  # agent/react.py picks which one to start based on nvidia-smi output; see
  # AGENT_VRAM_THRESHOLD_GB in .env for the 9B vs 4B model size cutoff within
  # each engine.
  atlas-agent:
    image: avarok/atlas-gb10:latest
    container_name: codenova-atlas-agent
    profiles: ["atlas-agent"]
    command: >
      serve ${ATLAS_MODEL:-AxionML/Qwen3.5-9B-NVFP4}
      --bind 0.0.0.0
      --port 8888
      --max-seq-len 8192
      --gpu-memory-utilization 0.6
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8888:8888"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llamacpp-agent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: codenova-llamacpp-agent
    profiles: ["llamacpp-agent"]
    command: >
      --hf-repo ${LLAMACPP_MODEL:-unsloth/Qwen3.5-9B-GGUF:Q4_K_M}
      --host 0.0.0.0
      --port 8888
      --ctx-size 8192
      --n-gpu-layers 99
      --chat-template-kwargs '{"enable_thinking":false}'
    ports:
      - "8888:8888"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - llamacpp_cache:/root/.cache/llama.cpp
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  vllm-index:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: codenova-vllm-index
    profiles: ["index"]
    command: >
      vllm serve cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
      --host 0.0.0.0
      --port 8881
      --dtype float16
      --max-model-len 8192
      --performance-mode throughput
      --max-num-seqs 24
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.7
      --enable-prefix-caching
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Full-text index for OCR/ASR search (BM25).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: codenova-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # Elasticvue is a browser app calling the ES REST API from a different
      # origin (port 8883 vs 8882) — CORS must be enabled or the browser
      # blocks the request even though the server itself is reachable
      # (curl/server-to-server calls aren't affected, only browser JS).
      - http.cors.enabled=true
      - http.cors.allow-origin=/https?:\/\/.*/
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      - "8882:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Web UI for Elasticsearch (ES itself has no built-in UI, only a REST API).
  elasticvue:
    image: cars10/elasticvue:latest
    container_name: codenova-elasticvue
    ports:
      - "8883:8080"
    restart: unless-stopped

volumes:
  elasticsearch_data:
  llamacpp_cache:
