services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codenova-qdrant
    ports:
      - "6333:6333"  # REST + web dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  vllm-retrieval:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: codenova-vllm-retrieval
    profiles: ["retrieval"]
    command: >
      vllm serve cyankiwi/Qwen3.5-9B-AWQ-4bit
      --host 0.0.0.0
      --port 8881
      --dtype float16
      --max-model-len 4096
      --performance-mode interactivity
      --max-num-seqs 4
      --gpu-memory-utilization 0.25
      --enable-prefix-caching
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  vllm-index:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: codenova-vllm-index
    profiles: ["index"]
    command: >
      vllm serve cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
      --host 0.0.0.0
      --port 8881
      --dtype float16
      --max-model-len 8192
      --performance-mode throughput
      --max-num-seqs 16
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.35
      --enable-prefix-caching
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # The agent LLM (Qwen3.5-4B, 4-bit) — the ONLY backend for VQA/TRAKE
  # answering, interactive chat, and query translation. Two engines, picked
  # by hardware via `make agent-up`, never both running (both bind 8888):
  #   atlas-agent     -> DGX Spark / GB10 only (nvidia-smi name contains "GB10").
  #                      Atlas reads HF checkpoints in its own quant formats
  #                      (NVFP4/FP8/BF16) — never GGUF or AWQ.
  #   llamacpp-agent  -> any other NVIDIA GPU. GGUF Q4_K_M via llama.cpp.
  atlas-agent:
    image: avarok/atlas-gb10:latest
    container_name: codenova-atlas-agent
    profiles: ["atlas-agent"]
    command: >
      serve ${ATLAS_MODEL:-AxionML/Qwen3.5-4B-NVFP4}
      --bind 0.0.0.0
      --port 8888
      --max-seq-len 8192
      --gpu-memory-utilization 0.6
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8888:8888"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llamacpp-agent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: codenova-llamacpp-agent
    profiles: ["llamacpp-agent"]
    command: >
      --hf-repo ${LLAMACPP_MODEL:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      --host 0.0.0.0
      --port 8888
      --ctx-size 8192
      --n-gpu-layers 99
      --chat-template-kwargs '{"enable_thinking":false}'
    ports:
      - "8888:8888"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - llamacpp_cache:/root/.cache/llama.cpp
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Full-text index for OCR/ASR search (BM25).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: codenova-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "8882:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Web UI for Elasticsearch (ES itself has no built-in UI, only a REST API).
  elasticvue:
    image: cars10/elasticvue:latest
    container_name: codenova-elasticvue
    ports:
      - "8883:8080"
    restart: unless-stopped

volumes:
  elasticsearch_data:
  llamacpp_cache:
