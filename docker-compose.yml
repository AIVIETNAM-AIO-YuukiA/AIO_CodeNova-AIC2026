services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codenova-qdrant
    ports:
      - "6333:6333"  # REST + web dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  vllm-index:
    image: vllm/vllm-openai:cu130-nightly
    container_name: codenova-vllm-index
    profiles: ["vllm-index"]
    environment:
      - VLLM_DISABLED_KERNELS=cutlass_moe_mm,cutlass_scaled_mm
      - TORCH_CUDA_ARCH_LIST=12.0
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command: >
      ${VLLM_INDEX_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
      --host 0.0.0.0
      --port 8881
      --max-model-len 8192
      --gpu-memory-utilization 0.5
      --max-num-seqs 16
      --moe-backend marlin
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
    ports:
      - "8881:8881"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    shm_size: "64gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Full-text index for OCR/ASR search (BM25).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: codenova-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      http.cors.enabled: "true"
      http.cors.allow-origin: '"*"'
      http.cors.allow-headers: X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      - "8882:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Web UI for Elasticsearch (ES itself has no built-in UI, only a REST API).
  elasticvue:
    image: cars10/elasticvue:latest
    container_name: codenova-elasticvue
    ports:
      - "8883:8080"
    restart: unless-stopped

volumes:
  elasticsearch_data:
